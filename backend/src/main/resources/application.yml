spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stageia}
    username: ${DB_USERNAME:stageia_user}
    password: ${DB_PASSWORD:stageia_pass}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET:c3RhZ2VpYS1zdXBlci1zZWNyZXQtand0LXNpZ25pbmcta2V5LWZvci1kZXYtb25seS1jaGFuZ2UtbWU=}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    seed-email: ${ADMIN_SEED_EMAIL:admin@stageia.local}
    seed-password: ${ADMIN_SEED_PASSWORD:ChangeMe123!}
  upload:
    dir: ${UPLOAD_DIR:uploads}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.8-flash}
